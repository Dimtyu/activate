<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Активация промокода — NEURAL TOKEN</title>
<style>
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:#04070f;color:#eaf7ff;display:flex;align-items:center;justify-content:center;
    padding:24px 16px;min-height:100vh;
    background-image:
      radial-gradient(900px 520px at 12% -10%,rgba(37,216,255,.18),transparent 60%),
      radial-gradient(760px 460px at 100% 110%,rgba(26,108,255,.16),transparent 62%);
  }
  .card{
    width:100%;max-width:470px;background:linear-gradient(160deg,rgba(12,28,58,.92),rgba(6,13,29,.96));
    border:1px solid rgba(94,206,255,.30);border-radius:22px;padding:30px 26px 26px;
    box-shadow:0 0 60px -20px rgba(37,216,255,.5),inset 0 1px 0 rgba(160,230,255,.14);
  }
  .brand{display:flex;align-items:center;gap:11px;margin-bottom:22px}
  .brand b{display:block;font-size:15px;letter-spacing:.4px}
  .brand span{display:block;font-size:11.5px;color:#6c8bb0;margin-top:2px}
  h1{font-size:26px;line-height:1.2;margin:0 0 8px;
     text-transform:uppercase;font-style:italic;letter-spacing:.3px;
     font-family:Impact,"Arial Black","Segoe UI Black",sans-serif;transform:skewX(-4deg)}
  .sub{font-size:13.5px;color:#a8c6e6;margin:0 0 22px;line-height:1.55}
  label{display:block;font-size:12px;font-weight:800;letter-spacing:1.2px;
        text-transform:uppercase;color:#6c8bb0;margin-bottom:8px}
  input{
    width:100%;padding:15px 16px;font-size:17px;letter-spacing:2px;text-align:center;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    color:#eaf7ff;background:#050d1d;border:1px solid rgba(94,206,255,.26);
    border-radius:13px;outline:none;text-transform:uppercase;
  }
  input:focus{border-color:rgba(120,226,255,.62);box-shadow:0 0 0 3px rgba(37,216,255,.14)}
  button{
    width:100%;margin-top:12px;padding:15px;font-size:16px;font-weight:800;cursor:pointer;
    color:#02121d;border:0;border-radius:13px;font-family:inherit;
    background:linear-gradient(180deg,#8df3ff,#22d3ff 46%,#12b7ee);
    box-shadow:0 0 0 1px rgba(160,244,255,.7),0 0 26px rgba(37,216,255,.55);
  }
  button:disabled{opacity:.6;cursor:default}
  .msg{margin-top:16px;padding:12px 14px;border-radius:12px;font-size:13.5px;display:none}
  .msg.err{display:block;color:#ffb3c0;background:rgba(255,84,112,.1);border:1px solid rgba(255,84,112,.45)}
  .msg.ok{display:block;color:#9bffd8;background:rgba(46,230,168,.1);border:1px solid rgba(46,230,168,.45)}
  .steps{margin-top:24px;padding-top:20px;border-top:1px solid rgba(94,206,255,.16);
         display:flex;flex-direction:column;gap:10px}
  .step{display:flex;gap:11px;align-items:flex-start;font-size:13px;color:#a8c6e6}
  .step i{flex:0 0 auto;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;
          font-size:11.5px;font-weight:800;font-style:normal;color:#02121d;
          background:linear-gradient(180deg,#8df3ff,#22d3ff)}
  code{color:#8fd4ff;font-size:12px}
</style>
</head>
<body>
<div class="card">
  <div class="brand">
    <svg viewBox="0 0 48 48" fill="none" width="34" height="34" aria-hidden="true">
      <g stroke="#25d8ff" stroke-width="3.1" stroke-linecap="round">
        <ellipse cx="24" cy="24" rx="16" ry="7.2"/>
        <ellipse cx="24" cy="24" rx="16" ry="7.2" transform="rotate(60 24 24)"/>
        <ellipse cx="24" cy="24" rx="16" ry="7.2" transform="rotate(120 24 24)"/>
      </g>
    </svg>
    <div><b>NEURAL TOKEN</b><span>доступ к ИИ-моделям по одному ключу</span></div>
  </div>

  <h1>Активация промокода</h1>
  <p class="sub">Введите промокод, который пришёл после покупки. Мы проверим его и сразу создадим вам кабинет.</p>

  <form id="f" autocomplete="off">
    <label for="code">🎁 Промокод</label>
    <input id="code" name="code" placeholder="NT-XXXX-XXXX" autocapitalize="characters"
           spellcheck="false" required>
    <button id="go" type="submit">Активировать</button>
  </form>

  <div class="msg" id="msg"></div>

  <div class="steps">
    <div class="step"><i>1</i><div>Проверяем промокод</div></div>
    <div class="step"><i>2</i><div>Создаёте аккаунт — баланс зачисляется сам</div></div>
    <div class="step"><i>3</i><div>Создаёте API-ключ и подключаете <code>https://neuraltoken.ru/v1</code></div></div>
  </div>
</div>

<script>
(function () {
  // Адрес вашего сайта. Менять только здесь.
  var SITE = "https://neuraltoken.ru";
  var API = SITE + "/api/promo/check";

  var form = document.getElementById("f");
  var input = document.getElementById("code");
  var btn = document.getElementById("go");
  var msg = document.getElementById("msg");

  function show(text, kind) {
    msg.textContent = text;
    msg.className = "msg " + kind;
  }

  function clean(v) {
    return (v || "").toUpperCase().replace(/\s+/g, "").replace(/\u00a0/g, "");
  }

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var code = clean(input.value);
    if (code.length < 6) { show("Введите промокод полностью.", "err"); input.focus(); return; }

    btn.disabled = true;
    show("Проверяем промокод…", "ok");

    // form-urlencoded — «простой» запрос, поэтому браузер не делает preflight
    var body = "code=" + encodeURIComponent(code);

    fetch(API, {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: body
    })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (data && data.ok) {
          show("Промокод принят. Переходим к созданию кабинета…", "ok");
          setTimeout(function () {
            location.href = SITE + "/promo?code=" + encodeURIComponent(data.code || code);
          }, 700);
          return;
        }
        show((data && data.error) || "Промокод не подошёл. Проверьте написание.", "err");
        btn.disabled = false;
      })
      .catch(function () {
        // сеть подвела — не теряем покупателя, уводим на сайт с кодом
        show("Проверка недоступна, переходим на сайт…", "ok");
        setTimeout(function () { location.href = SITE + "/promo?code=" + encodeURIComponent(code); }, 700);
      });
  });

  input.addEventListener("input", function () {
    var v = clean(input.value);
    if (v.length === 2) input.value = v + "-";
  });
})();
</script>
</body>
</html>
